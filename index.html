<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-store">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Door &amp; Window Guard</title>
<style>
  :root{
    --bg:#0b0d12;
    --bg-glow:rgba(56,189,248,0.07);
    --card:rgba(255,255,255,0.035);
    --card-edge:rgba(255,255,255,0.08);
    --text:#f4f6fa;
    --muted:#8a93a6;
    --muted-2:#5b6478;
    --accent:#3b82f6;
    --armed:#34d399;
    --alarm:#fb7185;
    --bypass:#fbbf24;
    --idle:#64748b;
    --chip:rgba(255,255,255,0.05);
    --chip-hi:rgba(255,255,255,0.09);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center;
    padding:max(18px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    min-height:100%;
    position:relative;
    overflow-x:hidden;
  }
  /* ambient glow behind the ring */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(700px 420px at 50% 8%, var(--bg-glow), transparent 70%),
      radial-gradient(500px 300px at 90% 100%, rgba(139,92,246,0.05), transparent 70%);
    transition:background 0.6s ease;
  }
  .app{ width:100%; max-width:420px; position:relative; }

  /* ---------- header ---------- */
  header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .title-wrap{ min-width:0; }
  .title-row{ display:flex; align-items:center; gap:6px; }
  #zoneName{
    font-size:24px; font-weight:800; letter-spacing:-0.5px;
    background:none; border:none; color:var(--text);
    padding:0; margin:0; max-width:220px; font-family:inherit;
  }
  #zoneName:focus{ outline:none; border-bottom:2px solid var(--accent); }
  .edit-btn{ background:none; border:none; padding:4px; color:var(--muted-2); display:flex; cursor:pointer; }
  .edit-btn svg{ width:14px; height:14px; }
  .sub{ font-size:11.5px; color:var(--muted-2); margin-top:3px; letter-spacing:0.2px; }

  .pill{
    display:flex; align-items:center; gap:7px; flex:none;
    padding:7px 12px; border-radius:999px;
    background:var(--chip); border:1px solid var(--card-edge);
    font-size:11.5px; font-weight:700; color:var(--muted);
    white-space:nowrap; margin-top:4px;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--idle); }
  .dot.on{ background:var(--armed); box-shadow:0 0 0 3px rgba(52,211,153,0.16); }
  .dot.off{ background:var(--alarm); box-shadow:0 0 0 3px rgba(251,113,133,0.16); }

  /* ---------- the ring ---------- */
  .stage{ display:flex; flex-direction:column; align-items:center; padding:22px 0 10px; }
  .ring-wrap{ position:relative; width:250px; height:250px; }
  .ring{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:8; stroke-linecap:round; }
  .ring-track{ stroke:rgba(255,255,255,0.06); }
  .ring-prog{
    stroke:var(--idle);
    stroke-dasharray:603.19;
    stroke-dashoffset:0;
    /* No transition on the offset — it's driven frame by frame in JS instead.
       A transition here fights the animation and reads as lag. And no
       drop-shadow: blurring a stroke that moves every frame is the single
       most expensive thing you can ask a phone to do here. The glow comes
       from the static .halo behind it instead. */
    transition:stroke 0.4s ease, opacity 0.4s ease;
    opacity:0.35;
  }
  .ring-wrap.armed  .ring-prog{ stroke:var(--armed); opacity:1; }
  .ring-wrap.bypass .ring-prog{ stroke:var(--bypass); opacity:1; }
  .ring-wrap.alarm  .ring-prog{ stroke:var(--alarm); opacity:1; }

  /* soft breathing halo behind the dial */
  .halo{
    position:absolute; inset:26px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.05), transparent 68%);
    transition:background 0.5s ease;
  }
  .ring-wrap.armed  .halo{ background:radial-gradient(circle, rgba(52,211,153,0.13), transparent 68%); animation:breathe 4s ease-in-out infinite; }
  .ring-wrap.bypass .halo{ background:radial-gradient(circle, rgba(251,191,36,0.13), transparent 68%); }
  .ring-wrap.alarm  .halo{ background:radial-gradient(circle, rgba(251,113,133,0.2), transparent 68%); animation:throb 1s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:0.75; transform:scale(1); } 50%{ opacity:1; transform:scale(1.03); } }
  @keyframes throb{ 0%,100%{ opacity:0.7; transform:scale(1); } 50%{ opacity:1; transform:scale(1.06); } }

  .ring-inner{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    text-align:center; padding:0 28px;
  }
  .hero-icon{ color:var(--idle); display:flex; transition:color 0.4s ease; }
  .hero-icon svg{ width:36px; height:36px; }
  .ring-wrap.armed  .hero-icon{ color:var(--armed); }
  .ring-wrap.bypass .hero-icon{ color:var(--bypass); }
  .ring-wrap.alarm  .hero-icon{ color:var(--alarm); }

  .hero-status{ font-size:22px; font-weight:800; letter-spacing:-0.5px; line-height:1.15; }
  .ring-wrap.armed  .hero-status{ color:var(--armed); }
  .ring-wrap.bypass .hero-status{ color:var(--bypass); }
  .ring-wrap.alarm  .hero-status{ color:var(--alarm); }
  .hero-timer{
    font-size:13px; font-weight:700; color:var(--muted);
    font-variant-numeric:tabular-nums; letter-spacing:0.5px;
  }

  .hero-sub{
    font-size:13.5px; color:var(--muted); line-height:1.55;
    text-align:center; max-width:310px; margin:14px auto 0;
  }
  .hero-sub strong{ color:var(--text); font-variant-numeric:tabular-nums; }

  .door-chip{
    display:inline-flex; align-items:center; gap:7px;
    margin-top:14px; padding:7px 14px; border-radius:999px;
    background:var(--chip); border:1px solid var(--card-edge);
    font-size:12px; font-weight:700; color:var(--muted);
  }
  .door-chip .dot.closed{ background:var(--armed); box-shadow:0 0 0 3px rgba(52,211,153,0.16); }
  .door-chip .dot.open{ background:var(--alarm); box-shadow:0 0 0 3px rgba(251,113,133,0.16); }

  /* ---------- buttons ---------- */
  button{ font-family:inherit; cursor:pointer; border:none; }
  .primary{
    width:100%; padding:17px; border-radius:16px; margin:22px 0 16px;
    background:linear-gradient(180deg, #4f8dfb, #2f6fe0);
    color:#fff; font-weight:750; font-size:15.5px; letter-spacing:0.2px;
    box-shadow:0 10px 24px -10px rgba(59,130,246,0.7);
    transition:transform 0.1s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }
  .primary:active{ transform:scale(0.985); }
  .primary.connected{
    background:var(--chip); color:var(--muted);
    border:1px solid var(--card-edge); box-shadow:none;
  }
  .primary:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:none; }

  .card{
    background:var(--card); border:1px solid var(--card-edge);
    border-radius:20px; padding:18px 16px 18px;
  }
  .card-label{
    font-size:11px; font-weight:800; color:var(--muted-2);
    letter-spacing:1.2px; text-transform:uppercase; margin:0 0 14px;
  }

  .chip-row{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:10px; }
  .chip{
    background:var(--chip); border:1px solid var(--card-edge); border-radius:14px;
    padding:15px 8px; text-align:center; color:var(--text);
    transition:background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .chip:hover{ background:var(--chip-hi); border-color:rgba(255,255,255,0.14); }
  .chip:active{ transform:scale(0.97); }
  .chip .num{ font-size:19px; font-weight:800; display:block; letter-spacing:-0.4px; }
  .chip .unit{ font-size:10px; color:var(--muted-2); letter-spacing:1px; text-transform:uppercase; font-weight:700; }
  .chip:disabled{ opacity:0.32; cursor:not-allowed; }

  .row{ display:flex; gap:9px; }
  .row input{
    flex:1; background:var(--chip); border:1px solid var(--card-edge); border-radius:14px;
    padding:14px; color:var(--text); font-size:14px; font-family:inherit;
  }
  .row input::placeholder{ color:var(--muted-2); }
  .row .go{
    background:var(--chip-hi); border:1px solid var(--card-edge); color:var(--text);
    font-weight:750; border-radius:14px; padding:0 20px; font-size:13.5px;
  }
  .row .go:disabled{ opacity:0.32; cursor:not-allowed; }
  .row.hidden, .pin-saved.hidden, .pin-error.hidden{ display:none; }
  #pinInput, #pinVerifyInput{ letter-spacing:5px; }
  #pinInput::placeholder, #pinVerifyInput::placeholder{ letter-spacing:0; }

  .pin-saved{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:14px; font-size:12px; color:var(--muted-2); font-weight:600;
  }
  .pin-saved button{
    background:none; color:var(--accent); font-weight:750; font-size:12px; padding:4px;
  }
  .pin-row{ margin-bottom:14px; }

  .pin-error{
    display:flex; gap:7px; margin-bottom:14px;
    background:rgba(251,113,133,0.12); color:var(--alarm);
    border:1px solid rgba(251,113,133,0.22);
    border-radius:14px; padding:11px 13px;
    font-size:12.5px; font-weight:650; line-height:1.45;
    animation:shake 0.32s ease;
  }
  @keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-5px);} 75%{ transform:translateX(5px);} }

  .danger{
    width:100%; padding:15px; border-radius:16px; margin-top:12px;
    background:rgba(251,113,133,0.12); border:1px solid rgba(251,113,133,0.25);
    color:var(--alarm); font-weight:750; font-size:14px;
    transition:opacity 0.25s ease, max-height 0.25s ease, margin 0.25s ease, padding 0.25s ease;
    max-height:60px; overflow:hidden;
  }
  .danger:disabled{ opacity:0; max-height:0; padding:0; margin:0; border-width:0; cursor:default; }

  .foot{
    text-align:center; font-size:10.5px; color:rgba(255,255,255,0.18);
    margin-top:22px; line-height:1.6; letter-spacing:0.3px;
  }
  #subLine{ cursor:default; user-select:none; -webkit-user-select:none; }

  /* hidden unless summoned */
  .debug{ display:none; margin-top:16px; }
  .debug.open{ display:block; }
  .log{
    font-size:11px; color:var(--muted-2); max-height:190px; overflow-y:auto;
    background:rgba(0,0,0,0.3); border:1px solid var(--card-edge);
    border-radius:14px; padding:12px; line-height:1.7;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .log-entry{ display:flex; gap:7px; }
  .log-time{ opacity:0.55; flex:none; }
  .diag-btn{
    width:100%; margin-top:9px; padding:11px; border-radius:12px;
    background:var(--chip); border:1px solid var(--card-edge);
    color:var(--muted); font-size:12px; font-weight:700;
  }

  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7fb; --bg-glow:rgba(59,130,246,0.09);
      --card:rgba(255,255,255,0.85); --card-edge:rgba(15,23,42,0.09);
      --text:#0f172a; --muted:#5c6679; --muted-2:#94a0b4;
      --armed:#059669; --alarm:#e11d48; --bypass:#d97706; --idle:#94a3b8;
      --chip:rgba(15,23,42,0.04); --chip-hi:rgba(15,23,42,0.07);
    }
    .ring-track{ stroke:rgba(15,23,42,0.07); }
    .log{ background:rgba(15,23,42,0.04); }
    .foot{ color:rgba(15,23,42,0.25); }
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="title-wrap">
      <div class="title-row">
        <input id="zoneName" value="Front Door" maxlength="20" aria-label="Sensor name">
        <button class="edit-btn" id="editZoneBtn" aria-label="Rename sensor">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        </button>
      </div>
      <div class="sub" id="subLine">micro:bit magnetic sensor</div>
    </div>
    <div class="pill"><span class="dot" id="linkDot"></span><span id="linkText">Offline</span></div>
  </header>

  <section class="stage">
    <div class="ring-wrap" id="ringWrap">
      <div class="halo"></div>
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-track" cx="110" cy="110" r="96"/>
        <circle class="ring-prog" id="ringProg" cx="110" cy="110" r="96"/>
      </svg>
      <div class="ring-inner">
        <div class="hero-icon" id="heroIcon"></div>
        <div class="hero-status" id="heroStatus" aria-live="polite">Not connected</div>
        <div class="hero-timer" id="heroTimer"></div>
      </div>
    </div>
    <div class="hero-sub" id="heroSub">Connect to your micro:bit to start monitoring.</div>
    <div class="door-chip" id="doorRow" style="display:none;">
      <span class="dot" id="doorDot"></span><span id="doorText"></span>
    </div>
  </section>

  <button class="primary" id="connectBtn">Connect to micro:bit</button>

  <section class="card">
    <div class="card-label">Allow open temporarily</div>

    <div class="row pin-row" id="pinRow">
      <input type="password" inputmode="numeric" id="pinInput" placeholder="Bypass PIN" maxlength="8" autocomplete="off">
      <button class="go" id="pinSaveBtn">Save</button>
    </div>
    <div class="row pin-row" id="pinVerifyRow">
      <input type="password" inputmode="numeric" id="pinVerifyInput" placeholder="Current PIN" maxlength="8" autocomplete="off">
      <button class="go" id="pinVerifyBtn">Unlock</button>
    </div>
    <div class="pin-saved" id="pinSaved">
      <span>PIN saved on this phone</span><button id="pinChangeBtn">Change</button>
    </div>
    <div class="pin-error" id="pinError"></div>

    <div class="chip-row">
      <button class="chip" data-mins="30" disabled><span class="num">30</span><span class="unit">min</span></button>
      <button class="chip" data-mins="60" disabled><span class="num">1</span><span class="unit">hour</span></button>
      <button class="chip" data-mins="180" disabled><span class="num">3</span><span class="unit">hours</span></button>
      <button class="chip" data-mins="480" disabled><span class="num">8</span><span class="unit">hours</span></button>
    </div>
    <div class="row">
      <input type="number" id="customMins" placeholder="Custom minutes" min="1" disabled>
      <button class="go" id="customBtn" disabled>Set</button>
    </div>
  </section>

  <button class="danger" id="cancelBtn" disabled>Cancel bypass — re-arm now</button>

  <div class="foot">micro:bit V2 · door &amp; window guard</div>

  <div class="debug" id="debugPanel">
    <div class="log" id="log"></div>
    <button class="diag-btn" id="diagBtn">Run Bluetooth diagnostics</button>
  </div>
</div>

<script>
const APP_BUILD = 'build 19';

const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
// The micro:bit names these from its own point of view, which is the reverse
// of the usual Nordic UART convention. negotiateUart() proves it at runtime
// rather than trusting either the spec or the browser's reported properties.
const UART_TX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // micro:bit -> app
const UART_RX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // app -> micro:bit

const RING_C = 603.19;   // circumference of r=96

let rxChar = null;
let device = null;
let busy = false;
let countdownTimer = null;
let bypassEndsAt = null;
let bypassTotal = 0;
let notifyAvailable = true;

const connectBtn = document.getElementById('connectBtn');
const linkDot = document.getElementById('linkDot');
const linkText = document.getElementById('linkText');
const ringWrap = document.getElementById('ringWrap');
const ringProg = document.getElementById('ringProg');
const heroIcon = document.getElementById('heroIcon');
const heroStatus = document.getElementById('heroStatus');
const heroTimer = document.getElementById('heroTimer');
const heroSub = document.getElementById('heroSub');
const doorRow = document.getElementById('doorRow');
const doorDot = document.getElementById('doorDot');
const doorText = document.getElementById('doorText');
const logEl = document.getElementById('log');
const chips = document.querySelectorAll('.chip');
const customMins = document.getElementById('customMins');
const customBtn = document.getElementById('customBtn');
const cancelBtn = document.getElementById('cancelBtn');
const zoneName = document.getElementById('zoneName');
const editZoneBtn = document.getElementById('editZoneBtn');
const diagBtn = document.getElementById('diagBtn');
const debugPanel = document.getElementById('debugPanel');
const subLine = document.getElementById('subLine');
const pinRow = document.getElementById('pinRow');
const pinInput = document.getElementById('pinInput');
const pinSaveBtn = document.getElementById('pinSaveBtn');
const pinSaved = document.getElementById('pinSaved');
const pinChangeBtn = document.getElementById('pinChangeBtn');
const pinVerifyRow = document.getElementById('pinVerifyRow');
const pinVerifyInput = document.getElementById('pinVerifyInput');
const pinVerifyBtn = document.getElementById('pinVerifyBtn');
const pinError = document.getElementById('pinError');

/* ---------- Icons ---------- */
const ICONS = {
  idle:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 6.3a9 9 0 1 0 12.6 12.6M3 3l18 18"/></svg>',
  armed:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5Z"/><path d="m9 12 2 2 4-4"/></svg>',
  alarm:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5Z"/><path d="M12 8v5M12 16h.01"/></svg>',
  bypass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>'
};

/* ---------- Zone name ---------- */
zoneName.value = localStorage.getItem('zoneName') || 'Front Door';
function commitZoneName(){
  const val = zoneName.value.trim() || 'Sensor';
  zoneName.value = val;
  localStorage.setItem('zoneName', val);
  zoneName.blur();
}
zoneName.addEventListener('blur', commitZoneName);
zoneName.addEventListener('keydown', e => { if (e.key === 'Enter') commitZoneName(); });
editZoneBtn.addEventListener('click', () => { zoneName.focus(); zoneName.select(); });

/* ---------- Bypass PIN ----------
   Enforced by the micro:bit, not here — this only carries it. Remembered on
   this phone so it isn't retyped; the point is someone else's phone lacks it. */
let bypassPin = localStorage.getItem('bypassPin') || '';
let pinMode = bypassPin ? 'saved' : 'entry';   // entry | saved | verify

function renderPinUi(){
  pinRow.classList.toggle('hidden', pinMode !== 'entry');
  pinVerifyRow.classList.toggle('hidden', pinMode !== 'verify');
  pinSaved.classList.toggle('hidden', pinMode !== 'saved');
}
function showPinError(msg){
  pinError.textContent = '⚠️ ' + msg;
  pinError.classList.remove('hidden');
  pinError.style.animation = 'none';
  void pinError.offsetWidth;
  pinError.style.animation = '';
  if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  log(msg);
}
function clearPinError(){
  pinError.textContent = '';
  pinError.classList.add('hidden');
}
clearPinError();

pinSaveBtn.addEventListener('click', () => {
  const val = pinInput.value.trim();
  if (!val){ showPinError('Enter your bypass PIN first.'); return; }
  bypassPin = val;
  localStorage.setItem('bypassPin', val);
  pinInput.value = '';
  pinMode = 'saved';
  clearPinError();
  renderPinUi();
  log('PIN saved on this phone.');
});
pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') pinSaveBtn.click(); });

pinChangeBtn.addEventListener('click', () => {
  pinMode = 'verify';
  clearPinError();
  renderPinUi();
  pinVerifyInput.value = '';
  pinVerifyInput.focus();
});
pinVerifyBtn.addEventListener('click', () => {
  const val = pinVerifyInput.value.trim();
  if (val !== bypassPin){
    showPinError('That is not the current PIN.');
    pinVerifyInput.value = '';
    pinVerifyInput.focus();
    return;
  }
  bypassPin = '';
  localStorage.removeItem('bypassPin');
  pinVerifyInput.value = '';
  pinMode = 'entry';
  clearPinError();
  renderPinUi();
  pinInput.focus();
  log('PIN cleared — enter the new one.');
});
pinVerifyInput.addEventListener('keydown', e => { if (e.key === 'Enter') pinVerifyBtn.click(); });

renderPinUi();

/* ---------- Log ----------
   Kept, but out of sight. Tap the build label five times to reveal it if
   something ever needs diagnosing. */
function log(msg){
  const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const row = document.createElement('div');
  row.className = 'log-entry';
  row.innerHTML = `<span class="log-time">${t}</span><span></span>`;
  row.lastChild.textContent = msg;
  logEl.prepend(row);
  while (logEl.children.length > 60) logEl.removeChild(logEl.lastChild);
}
// Five quick taps on the subtitle reveals (or hides) the log and diagnostics.
let buildTaps = 0, buildTapTimer = null;
subLine.addEventListener('click', () => {
  buildTaps++;
  clearTimeout(buildTapTimer);
  buildTapTimer = setTimeout(() => { buildTaps = 0; }, 1200);
  if (buildTaps >= 5){
    buildTaps = 0;
    debugPanel.classList.toggle('open');
  }
});

// Null it as well as clearing it, so startCountdown knows to start a new one.
function stopCountdown(){
  clearInterval(countdownTimer);
  countdownTimer = null;
  stopRingAnimation();
}

/* The ring is redrawn every animation frame, in step with the display's own
   refresh, so it sweeps continuously. A CSS transition can't do this — it
   would be restarted by each update and always be chasing a stale target. */
let ringRaf = null;
function startRingAnimation(){
  cancelAnimationFrame(ringRaf);
  const frame = () => {
    if (!bypassEndsAt || !bypassTotal){ ringRaf = null; return; }
    const remainingMs = Math.max(0, bypassEndsAt - Date.now());
    setRingFraction(remainingMs / (bypassTotal * 1000));
    ringRaf = remainingMs > 0 ? requestAnimationFrame(frame) : null;
  };
  ringRaf = requestAnimationFrame(frame);
}
function stopRingAnimation(){
  cancelAnimationFrame(ringRaf);
  ringRaf = null;
}

function setControlsEnabled(enabled){
  chips.forEach(k => k.disabled = !enabled);
  customMins.disabled = !enabled;
  customBtn.disabled = !enabled;
  cancelBtn.disabled = !enabled || !bypassEndsAt;
}

/* ---------- Status ring ---------- */
// Called once a second while a bypass counts down, so only touch what has
// actually changed — re-parsing the icon SVG every second is pure jank.
let lastKind, lastStatusText, lastSubText;
function setStatus(kind, statusText, subText, timerText){
  const k = kind || '';
  if (k !== lastKind){
    ringWrap.className = 'ring-wrap' + (kind ? ' ' + kind : '');
    heroIcon.innerHTML = ICONS[kind || 'idle'];
    lastKind = k;
  }
  if (statusText !== lastStatusText){
    heroStatus.textContent = statusText;
    lastStatusText = statusText;
  }
  if (subText !== lastSubText){
    heroSub.innerHTML = subText || '';
    lastSubText = subText;
  }
  heroTimer.textContent = timerText || '';
  if (kind !== 'bypass') setRingFraction(kind ? 1 : 0.999);
}
// 1 = full ring, 0 = empty
function setRingFraction(f){
  ringProg.style.strokeDashoffset = String(RING_C * (1 - Math.max(0, Math.min(1, f))));
}

function setDoor(state){
  if (state === null){ doorRow.style.display = 'none'; return; }
  doorRow.style.display = 'inline-flex';
  doorDot.className = 'dot ' + state;
  doorText.textContent = zoneName.value + (state === 'open' ? ' is open' : ' is closed');
}

function wait(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

/* ---------- UART auto-negotiation ----------
   Try each pairing, send STATUS, keep whichever actually replies. */
async function negotiateUart(service){
  let chars = [];
  try{
    chars = await service.getCharacteristics();
  }catch(e){
    log('Could not list UART characteristics: ' + e.name);
    return false;
  }
  log('UART service has ' + chars.length + ' characteristics.');

  const orderings = [];
  for (const listen of chars){
    for (const writeTo of chars){
      if (listen !== writeTo) orderings.push([listen, writeTo]);
    }
  }

  for (const [listen, writeTo] of orderings){
    const pair = listen.uuid.slice(0, 8) + ' ← listen / ' + writeTo.uuid.slice(0, 8) + ' → write';
    try{
      gotData = false;
      await listen.startNotifications();
      listen.addEventListener('characteristicvaluechanged', onData);

      const bytes = new TextEncoder().encode('STATUS\n');
      try{
        if (typeof writeTo.writeValueWithoutResponse === 'function'){
          await writeTo.writeValueWithoutResponse(bytes);
        } else {
          await writeTo.writeValue(bytes);
        }
      }catch(e){
        log('Tried ' + pair + ' — write rejected (' + e.name + ')');
      }

      await wait(1500);
      if (gotData){
        rxChar = writeTo;
        log('✓ UART wiring found — ' + pair);
        return true;
      }

      log('Tried ' + pair + ' — no reply.');
      listen.removeEventListener('characteristicvaluechanged', onData);
      try{ await listen.stopNotifications(); }catch(e){}
    }catch(e){
      log('Tried ' + pair + ' — subscribe failed (' + e.name + ')');
    }
  }

  rxChar = chars.find(c => c.properties.write || c.properties.writeWithoutResponse) || chars[0] || null;
  log('⚠️ No combination replied to STATUS. Either the micro:bit is not running the guard firmware, or it is not answering.');
  return false;
}

/* ---------- Connect ---------- */
async function connect(){
  if (busy){ log('Already working on a connection — ignoring that tap.'); return; }
  busy = true;
  let step = 'requestDevice';
  notifyAvailable = true;
  unlockAudio();
  ensureNotificationPermission();
  try{
    connectBtn.disabled = true;
    connectBtn.textContent = 'Connecting…';

    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'BBC micro:bit' }],
      optionalServices: [UART_SERVICE]
    });
    log('Device selected: ' + (device.name || 'unnamed'));
    device.addEventListener('gattserverdisconnected', onDisconnected);

    let service = null;
    let lastErr = null;
    for (let attempt = 1; attempt <= 4 && !service; attempt++){
      try{
        step = 'gatt.connect (attempt ' + attempt + ')';
        const server = await device.gatt.connect();
        await wait(300);
        step = 'getPrimaryService (UART service)';
        service = await server.getPrimaryService(UART_SERVICE);
      }catch(e){
        lastErr = e;
        log('Connect attempt ' + attempt + ' failed: ' + e.name + ' — ' + e.message);
        try{ if (device.gatt.connected) device.gatt.disconnect(); }catch(x){}
        await wait(700);
      }
    }
    if (!service) throw lastErr;

    step = 'negotiating UART characteristics';
    linkText.textContent = 'Linking…';
    linkDot.className = 'dot on';
    setStatus(null, 'Linking…', 'Working out how to talk to the micro:bit.');
    notifyAvailable = await negotiateUart(service);

    linkText.textContent = notifyAvailable ? 'Connected' : 'Send-only';
    linkDot.className = 'dot on';
    connectBtn.textContent = 'Disconnect';
    connectBtn.classList.add('connected');
    connectBtn.disabled = false;
    setControlsEnabled(true);
    holdScreenAwake();
    log('Connected to ' + (device.name || 'micro:bit'));
    if (notifyAvailable){
      setStatus(null, 'Connected', 'Waiting for status from the micro:bit…');
      requestStatus();
    } else {
      // Never claim "Armed" when the board hasn't answered.
      setStatus(null, 'No reply', 'Connected over Bluetooth, but the board isn\'t responding. Check it is powered on and running the guard firmware — it beeps once at startup.');
      setDoor(null);
    }
  }catch(err){
    log('Failed at "' + step + '": ' + err.name + ' — ' + err.message);
    if (err.name === 'NetworkError'){
      log('↳ A micro:bit accepts only ONE Bluetooth connection at a time. Close other tabs holding it, power-cycle the board, and try again.');
    }
    try{ if (device && device.gatt && device.gatt.connected) device.gatt.disconnect(); }catch(e){}
    connectBtn.textContent = 'Connect to micro:bit';
    connectBtn.disabled = false;
  }finally{
    busy = false;
  }
}

// Release the board when this tab goes away, or the micro:bit keeps
// believing it's still connected and refuses the next one.
window.addEventListener('pagehide', () => {
  try{ if (device && device.gatt && device.gatt.connected) device.gatt.disconnect(); }catch(e){}
});

function onDisconnected(){
  linkText.textContent = 'Offline';
  linkDot.className = 'dot off';
  connectBtn.textContent = 'Connect to micro:bit';
  connectBtn.classList.remove('connected');
  connectBtn.disabled = false;
  setControlsEnabled(false);
  setStatus(null, 'Not connected', 'Connect to your micro:bit to start monitoring.');
  setDoor(null);
  stopCountdown();
  stopPhoneAlert();
  releaseScreen();
  bypassEndsAt = null;
  log('Disconnected');
}

connectBtn.addEventListener('click', () => {
  if (device && device.gatt.connected){
    device.gatt.disconnect();
  } else {
    connect();
  }
});

/* ---------- Incoming data ---------- */
const decoder = new TextDecoder();
let buffer = '';
let gotData = false;
function onData(event){
  const chunk = decoder.decode(event.target.value);
  gotData = true;
  buffer += chunk;
  let idx;
  while ((idx = buffer.indexOf('\n')) >= 0){
    const line = buffer.slice(0, idx).trim();
    buffer = buffer.slice(idx + 1);
    if (line) handleLine(line);
  }
}

/* ---------- Local alerts ---------- */
let audioCtx = null;
function unlockAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playAlarmBeep(){
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  [0, 0.3, 0.6].forEach((offset) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.value = 0.2;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.2);
  });
}
async function ensureNotificationPermission(){
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try{ return (await Notification.requestPermission()) === 'granted'; }catch(e){ return false; }
}
async function showAlarmNotification(){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const title = zoneName.value + ' opened';
  const opts = {
    body: 'The ' + zoneName.value.toLowerCase() + ' has been opened.',
    icon: 'icon-192.png', badge: 'icon-192.png',
    tag: 'door-alarm', renotify: true, requireInteraction: true,
    vibrate: [200, 100, 200, 100, 200]
  };
  // Android Chrome throws on `new Notification()`; it needs a service worker.
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && reg.showNotification){ await reg.showNotification(title, opts); return; }
  }catch(e){}
  try{ new Notification(title, opts); }catch(e){ log('Could not show a notification: ' + e.name); }
}

/* ---------- Keep the page alive ----------
   The board is silent, so this phone is the only thing that will alert you.
   A backgrounded tab can have its Bluetooth suspended. */
let wakeLock = null;
async function holdScreenAwake(){
  try{
    if ('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      log('Screen will stay awake while connected.');
    }
  }catch(e){
    log('Could not keep the screen awake (' + e.name + ') — keep the app open.');
  }
}
function releaseScreen(){
  try{ if (wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && device && device.gatt && device.gatt.connected && !wakeLock){
    holdScreenAwake();
  }
});

let alarmPulse = null;
function triggerPhoneAlert(){
  showAlarmNotification();
  const pulse = () => {
    playAlarmBeep();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  };
  pulse();
  clearInterval(alarmPulse);
  alarmPulse = setInterval(pulse, 2500);
}
function stopPhoneAlert(){
  clearInterval(alarmPulse);
  alarmPulse = null;
}

/* ---------- Protocol ---------- */
function handleLine(line){
  if (line === 'ALARM_TRIGGERED'){
    setStatus('alarm', 'Alarm', zoneName.value + ' was opened while armed.');
    stopCountdown();
    bypassEndsAt = null;
    cancelBtn.disabled = true;
    log('⚠️ Alarm triggered');
    triggerPhoneAlert();
  } else if (line.startsWith('BYPASS_ACTIVE:')){
    const secs = parseInt(line.split(':')[1], 10);
    startCountdown(secs);
    log('Bypass active — ' + Math.round(secs/60) + ' min remaining');
  } else if (line.startsWith('BYPASSED:')){
    log('Bypass set for ' + line.split(':')[1] + ' min');
  } else if (line === 'ARMED'){
    setStatus('armed', 'Armed', 'Watching your ' + zoneName.value.toLowerCase() + '.');
    stopCountdown();
    bypassEndsAt = null;
    cancelBtn.disabled = true;
    stopPhoneAlert();
  } else if (line === 'SETUP'){
    setStatus(null, 'Setup needed', 'With the door closed and the magnet in place, press <strong>button A</strong> on the micro:bit.');
    setDoor(null);
    stopCountdown();
    bypassEndsAt = null;
    cancelBtn.disabled = true;
  } else if (line === 'DOOR_OPEN'){
    setDoor('open');
  } else if (line === 'DOOR_CLOSED'){
    setDoor('closed');
  } else if (line === 'BAD_PIN'){
    bypassPin = '';
    localStorage.removeItem('bypassPin');
    pinMode = 'entry';
    renderPinUi();
    showPinError('Wrong PIN — the micro:bit refused the bypass. Try again.');
    pinInput.focus();
  } else if (line === 'SILENCED'){
    log('Alarm cleared at the sensor');
  } else {
    log('Received: ' + line);
  }
}

function startCountdown(totalSecs){
  stopPhoneAlert();
  const newEnd = Date.now() + totalSecs * 1000;
  const firstTime = !bypassEndsAt;

  // Keep the original span so the ring drains proportionally, rather than
  // resetting to full on every heartbeat from the board.
  if (firstTime || totalSecs > bypassTotal) bypassTotal = totalSecs;

  // The board re-announces the remaining seconds every second. Re-snapping to
  // that whole-second value each time nudged the countdown and made the ring
  // jitter, so only accept it when we've genuinely drifted.
  if (firstTime || Math.abs(newEnd - bypassEndsAt) > 2000) bypassEndsAt = newEnd;

  cancelBtn.disabled = false;
  tickCountdown();
  // The text only needs a tick a second; the ring runs on animation frames.
  if (!countdownTimer) countdownTimer = setInterval(tickCountdown, 1000);
  if (!ringRaf) startRingAnimation();
}

function tickCountdown(){
  // Keep the raw millisecond value for the ring — rounding to whole seconds
  // first is what made it step and pause instead of gliding.
  const remainingMs = Math.max(0, bypassEndsAt - Date.now());
  const remaining = Math.ceil(remainingMs / 1000);
  const h = Math.floor(remaining / 3600);
  const m = Math.floor((remaining % 3600) / 60);
  const s = remaining % 60;
  const parts = [];
  if (h) parts.push(String(h).padStart(2,'0'));
  parts.push(String(m).padStart(2,'0'));
  parts.push(String(s).padStart(2,'0'));

  // Ring position is owned by the animation frame loop, not this tick.
  setStatus('bypass', 'Bypassed', 'Opening allowed — re-arms automatically.', parts.join(':'));

  if (remaining <= 0){
    stopCountdown();
    bypassEndsAt = null;
    bypassTotal = 0;
    cancelBtn.disabled = true;
    setStatus('armed', 'Armed', 'Watching your ' + zoneName.value.toLowerCase() + '.');
  }
}

async function sendCommand(text){
  if (!rxChar){ log('Cannot send "' + text + '" — not connected'); return false; }
  const bytes = new TextEncoder().encode(text + '\n');
  if (typeof rxChar.writeValueWithoutResponse === 'function'){
    try{ await rxChar.writeValueWithoutResponse(bytes); return true; }
    catch(err){ log('Send failed for "' + text + '": ' + err.name); }
  }
  try{ await rxChar.writeValue(bytes); return true; }
  catch(err){ log('Send failed for "' + text + '": ' + err.name); return false; }
}

function requestStatus(){ sendCommand('STATUS'); }

// Bypass carries the PIN; cancelling never does, so re-arming always works.
function bypassCommand(mins){
  return 'BYPASS:' + mins + (bypassPin ? ':' + bypassPin : '');
}

chips.forEach(chip => {
  chip.addEventListener('click', async () => {
    const mins = parseInt(chip.dataset.mins, 10);
    bypassTotal = mins * 60;
    const ok = await sendCommand(bypassCommand(mins));
    if (ok) log('Bypass request sent: ' + mins + ' min');
    else log('Bypass request did not reach the micro:bit');
  });
});

customBtn.addEventListener('click', async () => {
  const val = parseInt(customMins.value, 10);
  if (!val || val < 1){ showPinError('Enter a valid number of minutes.'); return; }
  bypassTotal = val * 60;
  const ok = await sendCommand(bypassCommand(val));
  if (ok) log('Custom bypass sent: ' + val + ' min');
  customMins.value = '';
});

cancelBtn.addEventListener('click', async () => {
  const ok = await sendCommand('BYPASS:0');
  if (ok) log('Cancel sent — re-arming');
});

/* ---------- Diagnostics (hidden: tap the build label 5×) ---------- */
const KNOWN_SERVICES = [
  UART_SERVICE,
  'e95d0753-251d-470a-a062-fa1922dfa9a8',
  'e95d9882-251d-470a-a062-fa1922dfa9a8',
  'e95dd91d-251d-470a-a062-fa1922dfa9a8',
  'e95d6100-251d-470a-a062-fa1922dfa9a8',
  'e95d93af-251d-470a-a062-fa1922dfa9a8',
  '0000180a-0000-1000-8000-00805f9b34fb'
];
function propsOf(c){
  const p = c.properties, f = [];
  if (p.read) f.push('read');
  if (p.write) f.push('write');
  if (p.writeWithoutResponse) f.push('writeNoResp');
  if (p.notify) f.push('NOTIFY');
  if (p.indicate) f.push('indicate');
  return f.length ? f.join(', ') : '(none)';
}
async function runDiagnostics(){
  if (busy){ log('Busy — wait for the current connection attempt.'); return; }
  busy = true;
  try{ await runDiagnosticsInner(); }finally{ busy = false; }
}
async function runDiagnosticsInner(){
  log('──────── DIAGNOSTICS ────────');
  log('Browser: ' + navigator.userAgent);
  if (!navigator.bluetooth){ log('✗ navigator.bluetooth missing'); return; }
  try{
    let dev = (device && device.gatt && device.gatt.connected) ? device : null;
    if (dev){ log('Reusing the existing connection.'); }
    else {
      dev = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }], optionalServices: KNOWN_SERVICES
      });
      log('Device: ' + (dev.name || 'unnamed'));
      await dev.gatt.connect();
      log('✓ GATT connected');
      await wait(400);
    }
    let services = [];
    try{
      services = await dev.gatt.getPrimaryServices();
      log('Services visible: ' + services.length);
    }catch(e){ log('getPrimaryServices failed: ' + e.name); }
    for (const s of services){
      log('▸ SERVICE ' + s.uuid);
      try{
        for (const c of await s.getCharacteristics()) log('    ' + c.uuid + '  [' + propsOf(c) + ']');
      }catch(e){ log('    (characteristics unreadable: ' + e.name + ')'); }
    }
    log('──────── END ────────');
  }catch(err){
    log('Diagnostics aborted: ' + err.name + ' — ' + err.message);
  }
}
diagBtn.addEventListener('click', runDiagnostics);

/* ---------- Boot ---------- */
// Not shown on screen any more, but still logged so the hidden panel can
// confirm which version is actually loaded if a cache ever misbehaves.
log('App ' + APP_BUILD);
setStatus(null, 'Not connected', 'Connect to your micro:bit to start monitoring.');

if (!navigator.bluetooth){
  log('Web Bluetooth is not available in this browser.');
  connectBtn.disabled = true;
  connectBtn.textContent = 'Bluetooth not supported';
}

/* No service worker, deliberately: offline caching bought nothing here and
   repeatedly served stale code. Remove any left over from older versions. */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(regs => { regs.forEach(r => r.unregister()); if (regs.length) log('Removed ' + regs.length + ' old service worker(s).'); })
    .catch(() => {});
}
if (window.caches){
  caches.keys().then(keys => { keys.forEach(k => caches.delete(k)); }).catch(() => {});
}
</script>
